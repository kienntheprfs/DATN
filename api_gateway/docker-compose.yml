version: '3.8'

services:
  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: api_gateway_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - gateway_network

  # OPA Policy Engine
  opa:
    image: openpolicyagent/opa:latest
    container_name: api_gateway_opa
    ports:
      - "8181:8181"
    volumes:
      - ./src/policies:/policies:ro
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "/policies"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8181/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - gateway_network

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: api_gateway_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: authdb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - gateway_network

volumes:
  redis_data:
  postgres_data:

networks:
  gateway_network:
    driver: bridge
