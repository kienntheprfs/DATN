version: '3.8'

services:
  # Databases
  postgres-agent:
    image: postgres:15
    environment:
      POSTGRES_DB: agentdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_agent_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-knowledge:
    image: postgres:15
    environment:
      POSTGRES_DB: knowledgedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_knowledge_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-wayfinder:
    image: postgres:15
    environment:
      POSTGRES_DB: wayfinderdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_wayfinder_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-dashboard:
    image: postgres:15
    environment:
      POSTGRES_DB: dashboarddb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_dashboard_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Cache and Message Queue
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Services
  api-gateway:
    build:
      context: ./api_gateway
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres-agent:5432/agentdb
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-your-secret-key}
    depends_on:
      postgres-agent:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api_gateway:/app
    restart: unless-stopped

  knowledge-base:
    build:
      context: ./knowledge
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres-knowledge:5432/knowledgedb
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      postgres-knowledge:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./knowledge:/app
    restart: unless-stopped

  agent-service:
    build:
      context: ./agent-service-toolkit
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres-agent:5432/agentdb
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      postgres-agent:
        condition: service_healthy
    volumes:
      - ./agent-service-toolkit:/app
    restart: unless-stopped

  wayfinder:
    build:
      context: ./wayfinder
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres-wayfinder:5432/wayfinderdb
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres-wayfinder:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./wayfinder:/app
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "8010:8010"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres-dashboard:5432/dashboarddb
    depends_on:
      postgres-dashboard:
        condition: service_healthy
    volumes:
      - ./dashboard:/app
    restart: unless-stopped

  voice-service:
    build:
      context: ./voice
      dockerfile: Dockerfile
    ports:
      - "7860:7860"
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./voice:/app
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8002
      - NEXT_PUBLIC_WS_URL=ws://localhost:8002
    depends_on:
      - api-gateway
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

  # Celery Worker for Knowledge Base
  celery-worker:
    build:
      context: ./knowledge
      dockerfile: Dockerfile
    command: celery -A src.tasks worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres-knowledge:5432/knowledgedb
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      postgres-knowledge:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./knowledge:/app
    restart: unless-stopped

  # Flower for Celery monitoring
  flower:
    build:
      context: ./knowledge
      dockerfile: Dockerfile
    command: celery -A src.tasks flower --port=5555
    ports:
      - "5555:5555"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres-knowledge:5432/knowledgedb
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
      - celery-worker
    volumes:
      - ./knowledge:/app
    restart: unless-stopped

volumes:
  postgres_agent_data:
  postgres_knowledge_data:
  postgres_wayfinder_data:
  postgres_dashboard_data:
  qdrant_data:
  redis_data:

networks:
  default:
    driver: bridge
