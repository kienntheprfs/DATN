services:
  embedding-service:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3 # Dùng bản CPU cho dev
    ports:
      - "3434:80"
    volumes:
      - ./data:/data
    command: 
      - --model-id
      - sentence-transformers/all-MiniLM-L6-v2
      # - hiieu/halong_embedding
      # - sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      - --max-batch-tokens
      - "2048"
      # - --max-concurrent-requests
      # - "2"
      # - Alibaba-NLP/gte-multilingual-base
      # - BAAI/bge-m3
    # deploy:
    #   resources:
    #     limits:
    #       memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 5

