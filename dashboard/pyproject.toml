[project]
name = "dashboard"
version = "0.1.0"
description = "Dashboard service"
requires-python = ">=3.11"
dependencies = [
	"fastapi>=0.115.0",
	"uvicorn[standard]>=0.30.0",
	"sqlmodel>=0.0.22",
	"sqlalchemy>=2.0.30",
	"httpx>=0.27.0",
	"asyncpg>=0.29.0",
	"psycopg2-binary>=2.9.9",
	"alembic>=1.13.2",
	"pydantic-settings>=2.5.2",
	"dotenv>=0.9.9",
	"celery>=5.4.0",
	"redis>=5.0.0",
	"sentence-transformers>=2.2.0",
	"scikit-learn>=1.4.0",
	"spacy>=3.8.13",
	"underthesea>=6.0.0",
	"pandas>=2.0.0",
	"httpx>=0.27.0",
	"flower>=2.0.1",
	"langgraph-checkpoint-postgres>=2.0.13",
	"langchain-core>=1.0.0",
	"psycopg[binary,pool]>=3.2.4",
	"bertopic>=0.17.4",
	"hdbscan>=0.8.43",
	"py-vncorenlp>=0.1.4",
	"umap-learn>=0.5.12",
	"gensim>=4.4.0",
	"tqdm>=4.67.3",
	"requests>=2.33.1",
	"jpype1>=1.7.1",
]

[dependency-groups]
dev = [
	"pytest>=8.3.0",
	"pytest-asyncio>=0.24.0",
	"httpx>=0.27.0",
	"aiosqlite>=0.20.0",
	"pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
	"e2e: end-to-end tests that call a running dashboard service",
]
